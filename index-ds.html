<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Beau Tableau</title>
    <style>
        /* Un peu de style pour que ce soit joli */
        table {
            width: 100%;
            border-collapse: collapse; /* Pour éviter les doubles bordures */
            margin: 20px 0;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #333; /* Bordure sombre */
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2; /* Couleur grise pour l'entête */
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #fafafa; /* Une ligne sur deux en gris clair */
        }
    </style>
</head>
<body>

    <h2>Liste des Utilisateurs</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Rôle</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Desire toumi</td>
                <td>Administrateur</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Edith</td>
                <td>Éditrice</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Emmanuella</td>
                <td>Utilisateur</td>
            </tr>
            <td>4</td>
                <td>Issa</td>
                <td>Utilisateur</td>
        </tbody>
    </table>

</body>
</html>
